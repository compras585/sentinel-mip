services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sentinel_mip
      POSTGRES_USER: sentinel_app
      POSTGRES_PASSWORD: sentinel_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_app -d sentinel_mip"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://sentinel_app:sentinel_local_only@postgres:5432/sentinel_mip?schema=public
      PORT: 3000
      API_PREFIX: api
      JWT_ACCESS_SECRET: local-development-access-secret-change-before-use
      JWT_REFRESH_SECRET: local-development-refresh-secret-change-before-use
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  sentinel_pgdata:
