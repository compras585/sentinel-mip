name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug -PSENTINEL_API_BASE_URL=https://api.example.invalid/api/

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-mip-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
